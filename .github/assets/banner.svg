<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Flashlark</title>
  <desc id="d">Vocabulary app with spaced repetition: learn words and remember them for good. Web and iOS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B3CF7"/>
      <stop offset="0.55" stop-color="#5741D8"/>
      <stop offset="1" stop-color="#2E1A86"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#14093F" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <circle cx="1130" cy="70" r="200" fill="#27C9E8" opacity="0.28" filter="url(#blur)"/>
    <circle cx="600" cy="430" r="200" fill="#A57BFF" opacity="0.45" filter="url(#blur)"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="72" y="116" fill="#D9CCFF" font-size="15" font-weight="700" letter-spacing="3">SPACED-REPETITION VOCABULARY APP</text>
      <text x="68" y="208" fill="#FFFFFF" font-size="96" font-weight="800" letter-spacing="-3">Flashlark</text>
      <text x="72" y="256" fill="#ECE6FF" font-size="24">Learn vocabulary — and remember it for good.</text>

      <g font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">
        <rect x="72" y="292" width="120" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.28"/>
        <text x="132" y="315">Web + iOS</text>
        <rect x="202" y="292" width="176" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.28"/>
        <text x="290" y="315">AI-generated decks</text>
        <rect x="388" y="292" width="146" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.28"/>
        <text x="461" y="315">7 study modes</text>
      </g>

      <!-- Card stack -->
      <rect transform="translate(884 50) rotate(9)" width="300" height="196" rx="22" fill="#FFFFFF" opacity="0.2"/>
      <rect transform="translate(864 66) rotate(4)" width="300" height="196" rx="22" fill="#FFFFFF" opacity="0.42"/>
      <g transform="translate(836 92) rotate(-3)" filter="url(#shadow)">
        <rect width="300" height="196" rx="22" fill="#FFFFFF"/>
        <rect x="24" y="22" width="84" height="26" rx="13" fill="#F0EAFF"/>
        <text x="66" y="40" fill="#7132F5" font-size="12" font-weight="700" text-anchor="middle">EN → RU</text>
        <text x="276" y="40" fill="#9497A9" font-size="13" font-weight="600" text-anchor="end">3 / 20</text>
        <text x="24" y="102" fill="#101114" font-size="38" font-weight="800" letter-spacing="-1">serendipity</text>
        <rect x="24" y="122" width="252" height="2" rx="1" fill="#EEEEF3"/>
        <text x="24" y="158" fill="#686B82" font-size="19" font-weight="500">счастливая случайность</text>
      </g>

      <!-- Next review pill -->
      <g transform="translate(796 300)" filter="url(#shadow)">
        <rect width="236" height="46" rx="23" fill="#FFFFFF"/>
        <circle cx="24" cy="23" r="14" fill="#F0EAFF"/>
        <circle cx="24" cy="23" r="8" fill="none" stroke="#7132F5" stroke-width="2"/>
        <path d="M24 18.5 V23 L27 25" fill="none" stroke="#7132F5" stroke-width="2" stroke-linecap="round"/>
        <text x="48" y="28.5" fill="#101114" font-size="14" font-weight="600">Next review in 3 days</text>
      </g>

      <!-- Review forecast -->
      <g transform="translate(1084 262)" filter="url(#shadow)">
        <rect width="166" height="118" rx="18" fill="#FFFFFF"/>
        <text x="18" y="30" fill="#9497A9" font-size="10.5" font-weight="700" letter-spacing="1.5">REVIEW FORECAST</text>
        <g fill="#C7B6FF">
          <rect x="18" y="68" width="14" height="32" rx="4" fill="#7132F5"/>
          <rect x="37" y="54" width="14" height="46" rx="4"/>
          <rect x="56" y="76" width="14" height="24" rx="4"/>
          <rect x="75" y="46" width="14" height="54" rx="4"/>
          <rect x="94" y="62" width="14" height="38" rx="4"/>
          <rect x="113" y="74" width="14" height="26" rx="4"/>
          <rect x="132" y="58" width="14" height="42" rx="4"/>
        </g>
      </g>
    </g>
  </g>
</svg>
